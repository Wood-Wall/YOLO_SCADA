# 异物留置检测系统 配置文件
# 你可以在这里修改参数，不用改代码

# YOLO 模型路径（默认 yolov8n.pt，可换成 yolo11n.pt 等）
model_path: "yolov8n.pt"

# 视频源
#   "0" = 本地摄像头
#   "rtsp://..." = 网络摄像头
#   "video.mp4" = 视频文件
video_source: "rtsp://admin:Geis2015@192.168.1.125/Streaming/Channels/101"

# 告警阈值（秒）：物体无人看管超过这个时间就告警
abandon_seconds: 30

# 是否保存结果视频
save_result: true

# 物体置信度阈值（0~1，越低越容易检测到，但误报也会多）
obj_conf: 0.25

# 人的置信度阈值（0~1，高一点减少背景误检）
person_conf: 0.65